[package]
name = "cngokz-backend"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["trace", "fs", "cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 本地 .env 文件加载（不存在则忽略，环境变量优先）
dotenvy = "0.15"
# PostgreSQL：connect_lazy 懒连接，无库可启动；migrate 供 migrations/ 离线编译
sqlx = { version = "0.8", features = ["postgres", "runtime-tokio", "tls-rustls", "migrate"] }
# Redis：Client 不建连，首次命令才连接，无库可启动
redis = { version = "0.27", features = ["tokio-comp"] }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
